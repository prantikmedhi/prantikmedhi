<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                style='isolation: isolate' viewBox='0 0 1000 220' width='1000px' height='220px' direction='ltr'>
        
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='1000' height='220' rx='4.5'/>
            </clipPath>
            <mask id='mask_out_ring_behind_fire'>
                <rect width='1000' height='220' fill='white'/>
                <ellipse id='mask-ellipse' cx='500' cy='32' rx='13' ry='18' fill='black'/>
            </mask>
            
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#eeeeea' fill='#faf9f6' rx='4.5' x='0.5' y='0.5' width='999' height='219'/>
            </g>
            <g style='isolation: isolate'>
                <line x1='333.33333333333' y1='34.25' x2='333.33333333333' y2='182.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#eeeeea' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
                <line x1='666.66666666667' y1='34.25' x2='666.66666666667' y2='182.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#eeeeea' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
            </g>
            <g style='isolation: isolate'>
                <!-- Total Contributions big number -->
                <g transform='translate(166.66666666667, 60.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#2f2f2f' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        5,246
                    </text>
                </g>

                <!-- Total Contributions label -->
                <g transform='translate(166.66666666667, 96.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#8a8a86' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Total Contributions
                    </text>
                </g>

                <!-- Total Contributions range -->
                <g transform='translate(166.66666666667, 126.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#8a8a86' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Aug 3, 2021 - Present
                    </text>
                </g>
            </g>
            <g style='isolation: isolate'>
                <!-- Current Streak label -->
                <g transform='translate(500, 120.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#8a8a86' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Current Streak
                    </text>
                </g>

                <!-- Current Streak range -->
                <g transform='translate(500, 157.5)'>
                    <text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#8a8a86' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Aug 25 - Aug 30
                    </text>
                </g>

                <!-- Ring around number -->
                <g mask='url(#mask_out_ring_behind_fire)'>
                    <circle cx='500' cy='83.5' r='40' fill='none' stroke='#dc143c' stroke-width='5' style='opacity: 1; opacity: 1;'></circle>
                </g>
                <!-- Fire icon -->
                <g transform='translate(500, 32)' stroke-opacity='0' style='opacity: 1; opacity: 1;'>
                    <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                    <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#dc143c' stroke-opacity='0'/>
                </g>

                <!-- Current Streak big number -->
                <g transform='translate(500, 60.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#2f2f2f' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='font-size: 28px;'>
                        6
                    </text>
                </g>

            </g>
            <g style='isolation: isolate'>
                <!-- Longest Streak big number -->
                <g transform='translate(833.33333333333, 60.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#2f2f2f' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        108
                    </text>
                </g>

                <!-- Longest Streak label -->
                <g transform='translate(833.33333333333, 96.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#8a8a86' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        Longest Streak
                    </text>
                </g>

                <!-- Longest Streak range -->
                <g transform='translate(833.33333333333, 126.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#8a8a86' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        May 6 - Aug 21
                    </text>
                </g>
            </g>
            
        </g>
    </svg>
