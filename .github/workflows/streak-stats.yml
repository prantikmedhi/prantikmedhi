name: Update GitHub streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=${{ github.repository_owner }}&background=faf9f6&border=eeeeea&stroke=eeeeea&ring=dc143c&fire=dc143c&currStreakNum=2f2f2f&sideNums=2f2f2f&currStreakLabel=8a8a86&sideLabels=8a8a86&dates=8a8a86&disable_animations=true&timezone=Asia%2FKolkata&card_width=1000&card_height=220
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated streak card
        run: |
          if [ -z "$(git status --porcelain -- profile/streak.svg)" ]; then
            echo "No streak changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: refresh GitHub streak stats"
          git push
